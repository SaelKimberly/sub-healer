[package]
name = "v2ray-heal"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"


[dependencies]
tokio = { version = "*", features = [
    "net",
    "io-std",
    "io-util",
    "bytes",
    "macros",
    "rt-multi-thread",
] }
futures = { version = "*" }
# [lints]
# workspace = true
clap = { version = "*", features = ["derive"] }
anyhow = { version = "*" }
thiserror = { version = "*" }
url = { version = "*" }
config = { version = "*", default-features = false, features = [
    "toml",
    "yaml",
] }
rustls = { version = "*", default-features = false, features = ["std"] }

tracing = { version = "*" }
tracing-subscriber = { version = "*", features = ["env-filter"] }

# for parsing/escaping/unescaping/decoding
nom = { version = "*" }
nom_locate = { version = "*" }

bytes = { version = "*" }
bstr = { version = "*" }
uuid = { version = "*", features = ["v5"] }
base64 = { version = "*" }
urlencoding = { version = "*" }
escape8259 = { version = "*" }
unescaper = { version = "*" }
simd-json = { version = "*" }
simdutf8 = { version = "*" }
chardetng = { version = "*", features = ["multithreading"] }

serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
serde_with = { version = "*" }
rapidhash = { version = "*" }
chrono = { version = "*", features = ["serde", "clock"] }

reqwest = { version = "*", features = ["stream"] }
scraper = { version = "*" }
yaml-rust2 = { version = "*" }
mimalloc = { version = "*" }
smartstring = { version = "*", features = ["serde"] }
smallvec = {  version = "*", features = ["const_new","const_generics"] }
rayon = { version = "*" }
rustc-hash = { version = "*" }
rusqlite = { version = "*", features = ["bundled"] }
ego-tree = { version = "*" }
aho-corasick = { version = "*" }
humantime = { version = "*" }
indicatif = { version = "*" }
tracing-indicatif = { version = "*" }

[dev-dependencies]
# CPU profiling: `cargo flamegraph --bin v2ray-heal -- mine`
# Requires: `cargo install flamegraph` and `sudo apt install linux-tools-common linux-tools-$(uname -r)` (or equivalent)
flamegraph = "*"
criterion = { version = "0.8.2" }

[[bench]]
name = "raw_urlx"
harness = false

[[bench]]
name = "proto_spec"
harness = false

[[bench]]
name = "slice_input"
harness = false

[[bench]]
name = "permissive_json"
harness = false
